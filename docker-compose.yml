services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: astro_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AstroClub2025"   
      MSSQL_PID: "Developer"                  
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql          
      - ./scripts/sql:/docker-entrypoint-initdb 
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "AstroClub2025" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:7.0
    container_name: astro_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: AstroMongo2025
      MONGO_INITDB_DATABASE: AstroClubMongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: astro_minio
    environment:
      MINIO_ROOT_USER: astro_admin
      MINIO_ROOT_PASSWORD: AstroMinio2025
    ports:
      - "9000:9000"    
      - "9001:9001"   
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
  mongodb_data:
  minio_data: